services:
  - type: web
    name: kinetix-app
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: APP_ENV
        value: production
      - key: TARGET_GMAIL_ACCOUNT
        value: exportdtp@gmail.com
      - key: GOOGLE_REDIRECT_URI
        value: https://kinetix-app.onrender.com/api/auth/callback

