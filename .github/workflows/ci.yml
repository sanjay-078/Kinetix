name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify project instructions
        shell: bash
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f docs/PRODUCTION_HANDOFF.md
          test -f .env.example

      - name: Reject obvious committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '(GOOGLE_CLIENT_SECRET|AI_API_KEY|SESSION_SECRET|ENCRYPTION_KEY)=[^[:space:]]+' -- ':!*.example' ':!*.md'; then
            echo "Potential committed secret detected."
            exit 1
          fi

      - name: Backend checks when backend exists
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d backend ]; then
            echo "Backend not created yet; bootstrap checks only."
            exit 0
          fi
          python -m pip install --upgrade pip
          cd backend
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]" || pip install -e .
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if command -v ruff >/dev/null 2>&1; then ruff check .; fi
          if command -v pytest >/dev/null 2>&1; then pytest -q; fi

      - name: Frontend checks when frontend exists
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f frontend/package.json ]; then
            echo "Frontend not created yet; bootstrap checks only."
            exit 0
          fi
          cd frontend
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npm run lint --if-present
          npm run typecheck --if-present
          npm test --if-present
          npm run build --if-present
